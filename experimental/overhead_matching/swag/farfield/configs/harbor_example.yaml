# Fully resolved example for boston_harbor_leg2. Copy to a new build recipe
# and change every version/path that the new build should publish or consume.

experiment:
  name: 260821_example_experiment

artifacts:
  frame_landmarks_version: v4
  pinhole_images_version: v1
  object_tracks_version: v1
  semantic_audits_version: v1
  bearing_observations_version: v1
  landmark_matches_version: v1
  alignment_diagnostics_version: v1
  localization_inputs_version: v1
  catalogs_version: v3_trimmed

extraction:
  model: gemini-3.1-pro-preview
  prompt_type: osm_tags_farfield
  pinhole_resolution: 2048
  media_resolution: MEDIA_RESOLUTION_ULTRA_HIGH
  thinking_level: HIGH

execution:
  llm_transport: batch
  batch_gcs_prefix: gs://REPLACE_ME/farfield/boston_harbor_leg2/b001
  approve_cost: false

cost:
  limit_usd: 50.0

ingest:
  fov_deg: 90.0
  seam_gap_norm: 25.0
  seam_min_y_iou: 0.3

tracking:
  sam2_checkpoint: sam2/sam2.1_hiera_large.pt
  range:
    k_start: 0
    k_end: 235
  reference_pano_width: 7680
  window_px: 1024
  window_extent_factor: 2.0
  window_quantum: 512
  window_max_px: 3072
  clean_iou: 0.45
  superset_min_inter_over_box: 0.10
  reanchor_min_inter_over_mask: 0.75
  superset_inter_over_mask: 0.7
  superset_max_inter_over_box: 0.4
  child_inter_over_box: 0.7
  child_max_inter_over_mask: 0.4
  weak_min_iou: 0.15
  weak_min_containment: 0.5
  weak_min_complement: 0.10
  birth_min_coverage: 0.15
  birth_max_spill: 0.5
  birth_min_dominant_cc: 0.6
  patience_keyframes: 15
  patience_unsupported_keyframes: 3
  min_mask_area_px: 20
  drift_gate_px: 150.0
  drift_patience: 3
  fragment_min_dominant_cc: 0.6
  fragment_patience: 3

audit:
  model: gemini-3-flash-preview
  min_supports: 2
  thinking_level: HIGH
  max_support_chips: 6
  max_context_chips: 2
  max_description_samples: 10
  chip_height_px: 320

matching:
  model: gemini-3-flash-preview
  query_batch: 10
  chunk_size: 500
  thinking_level: HIGH
  confidence_floor: 0.05
  instance_max_rows: 5

bearing_observations:
  bearing_sigma_deg: 1.0

gps_course:
  min_displacement_m: 2.0
  smooth_window_s: 5.0

alignment_diagnostics:
  sun:
    n_frames: 40
    min_speed_mps: 0.8
    elevation_tolerance_deg: 3.0
    work_width: 1440
  sweep:
    coarse_step_deg: 5.0
    fine_step_deg: 1.0
    fine_halfwidth_deg: 6.0
    min_observations: 4
    min_arc_deg: 20.0
    max_condition: 500.0
    min_tracklets: 5
    min_support_frac: 0.5

localization_inputs:
  motion_source: frames_gps.csv
  nominal_forward_calibration: nominal_forward.json
  identity_review_dir: null
  use_uninformative_tables: false
  default_log_compatibility: 0.0
  compatibility_clip: 4.0
  reducer_epoch_keyframes: 5
  # Per-pair chord noise, emitted per step. Deliberately NOT reduced to a
  # drift budget like yaw: heading-frame re-integration breaks the
  # telescoping cancellation on turns, and tightening this measurably
  # collapses whole-map capture (0.1 m: tn-500 0.52 -> 0.05).
  odometry_sigma_pair_m: 1.0
  displacement_gate_m: 2.0
  stationary_sigma_m: 2.0
  slow_yaw_sigma_deg: 30.0
  # Per-step drift budget for differenced-course yaw. Its measurement
  # noise telescopes (bounded by the endpoint course sigmas), so the
  # per-chord noise must NOT be emitted as independent per-step sigma.
  course_yaw_drift_sigma_deg: 2.0
  # IMU emulation grade (required): independent per-step noise INJECTED
  # into the delta values and declared in the emitted sigmas, so the
  # odometry stream is an honest surrogate for the deployed platform's
  # inertial increments rather than telescoping GPS-course deltas.
  # Wiener process in distance travelled: sigma per step = coefficient x
  # sqrt(step length), in m/sqrt(m) and rad/sqrt(m). Coefficients keep
  # ReWAG's values (arXiv:2308.07432, 2% odometry / 1% heading); at ~3 m
  # keyframes the yaw diffusion is ~1 deg/keyframe.
  imu_translation_noise_frac: 0.02
  imu_yaw_noise_frac: 0.01
  reverse_keyframe_ranges: []
  reverse_annotation_source: human_review_no_reverse_segments
  max_visible_range_m: 15000.0
  landmark_position_sigma_m: 25.0

localization:
  run_name: boston_harbor_leg2_v1
  init: uniform
  ablation_tags: []
  # Primary evaluation metric is normalized mass within 500 m of truth;
  # 100 m is the tighter default companion metric.
  position_mass_radii_m: [100.0, 500.0]
  prior_sigma_m: null
  n_particles: 50000
  seed: 0
  margin_m: 1000.0
  pi0: 0.2
  ess_resample_frac: 0.5
  # The odometry producer declares its own drift (course_yaw_drift +
  # injected IMU noise); this filter-side hedge is for UNDECLARED model
  # error only. Keep 0 so heading drift has one owner.
  heading_random_walk_deg: 0.0
  resample_regularization: 1.0
  position_roughening_m: 25.0
  heading_roughening_deg: 1.0
  map_cell_size_m: 50.0
  checkpoint_every: 10
  measurement_backend: numpy
  association_persistence: true
  association_renewal_rate: 0.1
  association_outlier_rate: 0.1
  matcher_recall: 0.5
  min_reported_responsibility: 0.000001
  # Resampling survival floor: guaranteed offspring per represented
  # hypothesis group (0 = off); groups below the min mass may die.
  resample_survival_floor: 0
  resample_survival_min_mass: 1.0e-9
  bearings_enabled: true
  proposal:
    enabled: true
    on_init: true
    null_share_threshold: 0.8
    null_share_window: 8
    null_share_min_fraction: 0.25
    ess_floor_frac: 0.02
    ess_floor_keyframes: 3
    refractory_keyframes: 10
    max_tracklets: 5
    exhaustive_tuple_limit: 256
    tuple_samples_per_active_solution: 8
    min_particles_point_fix: 32
    min_particles_arc: 64
    min_particles_single: 128
    solution_cluster_position_m: 75.0
    solution_cluster_heading_deg: 8.0
    pose_diversity_weight: 0.25
    arc_length_reference_m: 1000.0
    arc_length_weight_cap: 10.0
    residual_tolerance_sigma: 3.0
    max_residual_tolerance_deg: 90.0
    window_keyframes: 4
    evidence_gate: true
    evidence_gate_margin_nats: 1.0
    evidence_gate_selection_charge: true
    min_tracklets_for_injection: 3
    init_max_wait_keyframes: 40
    evidence_gate_samples: 16
    share_triple: 0.5
    share_pair: 0.35
    share_single: 0.15
    inject_fraction: 0.5
    injection_sigma_m: 100.0
    injection_heading_sigma_deg: 3.0
    max_injection_sigma_m: 2000.0
  modes:
    enabled: true
    cell_size_m: 150.0
    heading_cell_deg: 20.0
    min_cell_weight: 0.0001
    min_mode_weight: 0.02

# Viewer page tuning. Recorded here so the orchestrator and the viewer
# cannot hold two different sets of defaults; retuning these does not
# invalidate the localization run the page displays.
viewer:
  max_particles: 900
  basemap_detail: 1.0
  embed_source_chips: true

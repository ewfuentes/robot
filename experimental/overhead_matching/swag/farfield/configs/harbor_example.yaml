# Example run config for a harbor boat leg. EVERY result-shaping value is
# explicit here — there are no defaults anywhere in the pipeline, so the
# recorded config IS the complete description of what a run did (REORG.md
# rule 2/3). Copy this file per environment class and edit; pipeline new-run
# validates that no required key is missing before anything runs.
#
# The values below are the ones the harbor legs shipped with (previously
# scattered across argparse defaults).

experiment:
  # runs/<name>/ is where this run's localization outputs land; the
  # directory carries an experiment.md saying what is being explored.
  name: 260821_example_experiment

artifacts:
  frame_landmarks_version: v4
  pinhole_images_version: v1
  object_tracks_version: v1

catalog:
  name: v3_trimmed          # stem under artifacts/catalogs/<dataset>/

extraction:
  model: gemini-3.1-pro-preview
  prompt_type: osm_tags_farfield
  pinhole_resolution: 2048
  media_resolution: MEDIA_RESOLUTION_ULTRA_HIGH
  thinking_level: HIGH

ingest:
  fov_deg: 90.0
  seam_gap_norm: 25
  seam_min_y_iou: 0.3

tracking:
  sam2_checkpoint: sam2/sam2.1_hiera_large.pt   # under <root>/models/

audit:
  model: gemini-3-flash-preview
  min_supports: 2           # audit membership is the tracklet gate
  thinking_level: HIGH
  max_support_chips: 6
  max_context_chips: 2
  max_description_samples: 10
  chip_height_px: 320

matching:
  model: gemini-3-flash-preview
  query_batch: 10
  chunk_size: 500
  thinking_level: HIGH
  confidence_floor: 0.05
  instance_max_rows: 5

calibration:
  sun:
    n_frames: 40
    min_speed_mps: 0.8
    elevation_tolerance_deg: 3.0
    work_width: 1440
  sweep:
    coarse_step: 5.0
    fine_step: 1.0
    fine_halfwidth: 6.0
    min_observations: 4
    min_arc_deg: 20.0
    max_condition: 500.0
    min_tracklets: 5
    min_support_frac: 0.5

fusion:
  epoch_keyframes: 5
  bearing_sigma_deg: 1.0

export:
  default_log_lr: 0.0
  clip: 4.0
  min_step_m: 2.0
  sigma_pair_m: 1.0
  max_visible_range_m: 15000.0

localization:
  n_particles: 50000
  margin_m: 1000.0
  position_roughening_m: 25.0
  heading_roughening_deg: 1.0

cost:
  limit_usd: 50.0
